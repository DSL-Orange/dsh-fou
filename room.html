<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>房间 · 浮游</title>
<style>
  /* ── 房间（2026-11-13）
     用户："一个聊天室能够将你们双方的消息都呈现出来，我可以围观，可以发言，可以打断。"
     "开间本身意味着另一条路，类似挂板和编辑都实现的输入/输出的模式……将权限交给会话。"

     判据（写进这里，因为它是这个页面的存在理由）：
       · 挂板 = 人写给会话（单向）
       · 编辑器 = 人写给会话（单向）
       · **房间 = 人和会话写在同一个地方（双向）**

     所以这一页不是"聊天界面"，是**一个所有方都能读写的地方**。
  */
  :root {
    --ink: #1f2937;
    --dim: #6b7280;
    --line: #e5e7eb;
    --card: #fff;
    --accent: #4d6bfe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #fbfbfc 0%, #f7f8fa 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .72);
    backdrop-filter: blur(8px);
  }
  header .title { font-weight: 600; font-size: 13px; }
  header .grow { flex: 1; }
  header .hint { color: var(--dim); font-size: 11px; }
  header button.reload {
    border: 0; background: transparent; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  header button.reload:hover { background: #eee; color: var(--ink); }

  #stream {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 86%;
  }
  .msg .meta {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
    color: var(--dim);
  }
  .msg .who { font-weight: 600; color: #4b5563; }
  .msg .body {
    padding: 7px 11px;
    border-radius: 12px;
    background: var(--card);
    box-shadow: 0 1px 2px #0000000a, 0 3px 10px #0000000d;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 自己说的：靠右、淡蓝 */
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.me .body { background: #eff4ff; border: .5px solid #d7e2ff; }
  /* 系统/浮游：居中、窄、灰 */
  .msg.sys { align-self: center; max-width: 92%; }
  .msg.sys .body { background: transparent; box-shadow: none; color: var(--dim); font-size: 11.5px; text-align: center; }

  .empty {
    margin: auto;
    color: #b6bcc6;
    text-align: center;
    line-height: 2;
    font-size: 12px;
  }
  .empty code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; color: #4b5563; }

  footer {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, .72);
    backdrop-filter: blur(8px);
  }
  footer input {
    flex: 1;
    border: .5px solid var(--line);
    border-radius: 10px;
    padding: 8px 11px;
    font: inherit;
    font-size: 12.5px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  footer input:focus { border-color: var(--accent); }
  footer button.send {
    flex: none;
    border: 0;
    border-radius: 10px;
    padding: 0 16px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  footer button.send:disabled { background: #c7cfda; cursor: default; }
</style>
</head>
<body>
<header>
  <span class="title">房间</span>
  <span class="grow"></span>
  <span class="hint" id="hint"></span>
  <button class="reload" id="reload" type="button" title="重新读一次">↻</button>
</header>

<div id="stream"></div>

<footer>
  <input id="say" type="text" placeholder="说句话…" autocomplete="off" spellcheck="false" />
  <button class="send" id="send" type="button">发</button>
</footer>

<script>
(function () {
  'use strict';

  var ME = '你';
  var lastCount = -1;
  var stream = document.getElementById('stream');
  var hint = document.getElementById('hint');
  var input = document.getElementById('say');
  var sendBtn = document.getElementById('send');

  function hhmm(ts) {
    try {
      var d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } catch (e) { return ''; }
  }

  function render(messages) {
    if (!Array.isArray(messages)) messages = [];
    if (messages.length === lastCount) return;
    lastCount = messages.length;

    var keepBottom = stream.scrollTop + stream.clientHeight >= stream.scrollHeight - 40;
    stream.textContent = '';

    if (!messages.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML =
        '房间是空的。这里是人、浮游、以及任何会话共用的一个地方。<br>' +
        '在下面说一句，或者让一个会话说 <code>POST /dsh-fou/room</code>。';
      stream.appendChild(e);
      return;
    }

    messages.forEach(function (m) {
      var row = document.createElement('div');
      var kind = m.kind === 'sys' ? 'sys' : (m.from === '你' ? 'me' : '');
      row.className = 'msg' + (kind ? ' ' + kind : '');

      var meta = document.createElement('div');
      meta.className = 'meta';
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = m.from || '?';
      var at = document.createElement('span');
      at.textContent = hhmm(m.ts);
      meta.appendChild(who);
      meta.appendChild(at);

      var body = document.createElement('div');
      body.className = 'body';
      body.textContent = m.text || '';

      row.appendChild(meta);
      row.appendChild(body);
      stream.appendChild(row);
    });

    if (keepBottom) stream.scrollTop = stream.scrollHeight;
    hint.textContent = messages.length + ' 条';
  }

  function refresh() {
    fetch('/dsh-fou/room', { headers: { 'x-dsh-fou': '1' } })
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j && j.messages); })
      .catch(function () { hint.textContent = '读取失败'; });
  }

  function say(text) {
    var body = { from: ME, text: text };
    fetch('/dsh-fou/room', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-dsh-fou': '1' },
      body: JSON.stringify(body),
    })
      .then(function (r) { return r.json(); })
      .then(function () { input.value = ''; lastCount = -1; refresh(); })
      .catch(function () { hint.textContent = '发送失败'; });
  }

  sendBtn.addEventListener('click', function () {
    var t = input.value.trim();
    if (t) say(t);
  });
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.isComposing) {
      var t = input.value.trim();
      if (t) say(t);
    }
  });
  document.getElementById('reload').addEventListener('click', refresh);

  refresh();
  window.setInterval(refresh, 3000);
})();
</script>
</body>
</html>
